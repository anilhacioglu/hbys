<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto" style="background:#090d16; border-radius:18px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c43"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.8)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="18" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="120" y1="0" x2="120" y2="420"/>
    <line x1="240" y1="0" x2="240" y2="420"/>
    <line x1="360" y1="0" x2="360" y2="420"/>
    <line x1="480" y1="0" x2="480" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="720" y1="0" x2="720" y2="420"/>
    <line x1="840" y1="0" x2="840" y2="420"/>
    <line x1="960" y1="0" x2="960" y2="420"/>
    <line x1="1080" y1="0" x2="1080" y2="420"/>
  </g>

  <!-- Decorative Glow Orbs -->
  <circle cx="150" cy="100" r="140" fill="#0284c7" opacity="0.18" filter="url(#glow)"/>
  <circle cx="1050" cy="220" r="160" fill="#10b981" opacity="0.15" filter="url(#glow)"/>

  <!-- Top Badge -->
  <g transform="translate(60, 48)">
    <rect width="360" height="34" rx="17" fill="rgba(14, 165, 233, 0.15)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="5" fill="#38bdf8"/>
    <text x="32" y="22" font-size="12" font-weight="700" fill="#7dd3fc" letter-spacing="1.5">T.C. SAĞLIK BİLİŞİMİ STANDARTLARI • v2.0</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="132" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.8">
    Hastane Bilgi Yönetim Sistemi
  </text>
  <text x="60" y="174" font-size="28" font-weight="800" fill="url(#primaryGrad)" letter-spacing="-0.5">
    Kurumsal Full-Stack HBYS &amp; Klinik Otomasyon
  </text>

  <!-- Subtitle -->
  <text x="60" y="210" font-size="14.5" fill="#94a3b8" font-weight="400">
    Eski WinForms mimarisinden 3. Normal Form (3NF) İlişkisel SQLite, Prisma ORM,
  </text>
  <text x="60" y="232" font-size="14.5" fill="#94a3b8" font-weight="400">
    Rol Bazlı Yetkilendirme (7 Rol), MEDULA E-Reçete ve Modern Next.js 15 altyapısına sıfırdan taşındı.
  </text>

  <!-- Metrics Bento Badges -->
  <g transform="translate(60, 272)">
    <!-- Metric 1 -->
    <g transform="translate(0, 0)">
      <rect width="245" height="100" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="20" y="34" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">VERİTABANI MİMARİSİ</text>
      <text x="20" y="68" font-size="26" font-weight="900" fill="#ffffff">3NF İlişkisel</text>
      <text x="20" y="86" font-size="11" fill="#64748b">12 Bağımsız Tablo • SQLite</text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(265, 0)">
      <rect width="245" height="100" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="20" y="34" font-size="11" font-weight="700" fill="#34d399" letter-spacing="1">GÜVENLİK &amp; ERİŞİM</text>
      <text x="20" y="68" font-size="26" font-weight="900" fill="#ffffff">7 Rol (RBAC)</text>
      <text x="20" y="86" font-size="11" fill="#64748b">BCrypt + Web Crypto JWT</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(530, 0)">
      <rect width="245" height="100" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="20" y="34" font-size="11" font-weight="700" fill="#a78bfa" letter-spacing="1">KLİNİK ENTEGRASYON</text>
      <text x="20" y="68" font-size="26" font-weight="900" fill="#ffffff">E-Reçete &amp; Lab</text>
      <text x="20" y="86" font-size="11" fill="#64748b">MEDULA Formatı + Panik Değer</text>
    </g>

    <!-- Metric 4 -->
    <g transform="translate(795, 0)">
      <rect width="285" height="100" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <text x="20" y="34" font-size="11" font-weight="700" fill="#fbbf24" letter-spacing="1">DENETİM &amp; RAPORLAMA</text>
      <text x="20" y="68" font-size="26" font-weight="900" fill="#ffffff">KVKK Audit Log</text>
      <text x="20" y="86" font-size="11" fill="#64748b">IP / Zaman Damgası + Excel/CSV</text>
    </g>
  </g>
</svg>